apiVersion: v1
kind: ConfigMap
metadata:
  name: plausible-config
  namespace: plausible
data:
  # Plausible environment variables
  # BASE_URL is set via secret as it may contain sensitive info
  # Database connections
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "plausible"
  CLICKHOUSE_HOST: "clickhouse"
  CLICKHOUSE_PORT: "8123"
  CLICKHOUSE_DB: "plausible_events"

  # Feature flags
  DISABLE_REGISTRATION: "invite_only"  # Set to "true" to disable all registrations

  # Logging
  LOG_FAILED_LOGIN_ATTEMPTS: "true"

  # IP Geolocation (optional - requires MaxMind license key in secrets)
  # IP_GEOLOCATION_DB: "/var/lib/plausible/GeoLite2-City.mmdb"
