apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
  namespace: plausible
spec:
  serviceName: clickhouse
  replicas: 1
  selector:
    matchLabels:
      app: clickhouse
  template:
    metadata:
      labels:
        app: clickhouse
    spec:
      containers:
      - name: clickhouse
        image: clickhouse/clickhouse-server:24.12-alpine
        ports:
        - containerPort: 8123
          name: http
        - containerPort: 9000
          name: native
        env:
        - name: CLICKHOUSE_DB
          valueFrom:
            configMapKeyRef:
              name: plausible-config
              key: CLICKHOUSE_DB
        volumeMounts:
        - name: clickhouse-storage
          mountPath: /var/lib/clickhouse
        # Supplies allow-remote.xml so Plausible can connect from another pod.
        # The ConfigMap is created out of band and is deliberately not in this
        # repo: it contains a <password> element and this repository is public.
        #   kubectl create configmap clickhouse-users -n plausible \
        #     --from-file=allow-remote.xml=<your-local-copy>
        - name: clickhouse-users
          mountPath: /etc/clickhouse-server/users.d
          readOnly: true
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /ping
            port: 8123
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ping
            port: 8123
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: clickhouse-storage
        persistentVolumeClaim:
          claimName: clickhouse-pvc
      - name: clickhouse-users
        configMap:
          name: clickhouse-users
